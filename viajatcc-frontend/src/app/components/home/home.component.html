<div class="layout">
  <div class="sidebar" *ngIf="menu">
    <button (click)="onClick(false)">
      <mat-icon class="menu-button-sidebar">close</mat-icon>
    </button>
    <app-sidebar [user]="user"></app-sidebar>
  </div>

  <div class="home">
    <button (click)="onClick(true)" *ngIf="!menu">
      <mat-icon class="menu-button">menu</mat-icon>
    </button>
    <div class="topbar">
      <div class="user-info">
        <div class="user-text">
          <span class="username">Olá, {{ nome }}</span>
          <button class="signout" (click)="logout()">Sair</button>
        </div>
        <img [src]="imageUser" alt="Avatar do Usuário" class="avatar-small" />
      </div>
    </div>
    <router-outlet></router-outlet>
  </div>
</div>
