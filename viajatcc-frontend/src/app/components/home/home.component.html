<div class="layout">
  <div class="sidebar" id="sidebar">
    <!-- <button (click)="onClick(false)">
      <mat-icon class="menu-button-sidebar">close</mat-icon>
    </button> -->
    <app-sidebar class="sidebar"  [user]="user"></app-sidebar>
  </div>

  <div class="home">
    <div class="topbar">
      <div class="menu-button">
        <button (click)="onClick(true)">
          <mat-icon class="menu-ico">menu</mat-icon>
        </button>
      </div>
      <div class="user-info">
        <div class="user-text">
          <span class="username">Olá, {{ nome }}</span>
          <button class="signout" (click)="logout()">Sair</button>
        </div>
        <img [src]="imageUser" alt="Avatar do Usuário" class="avatar-small" />
      </div>
    </div>
    <router-outlet></router-outlet>
  </div>
</div>
