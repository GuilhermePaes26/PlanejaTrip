<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-tr from-blue-600 via-blue-400 to-cyan-300 px-2"
>
  <div
    class="w-full max-w-4xl bg-white rounded-xl shadow-2xl flex flex-col md:flex-row overflow-hidden"
  >
    <!-- Lado da Imagem -->
    <div
      class="md:w-1/2 bg-white flex items-center justify-center p-8 border-b md:border-b-0 md:border-r"
    >
      <img
        src="https://res.cloudinary.com/dsadhjxa4/image/upload/v1749009696/Adobe_Express_-_file_o7rrru.png"
        alt="Logo PlanejaTrip"
        class="max-h-40 mx-auto"
      />
    </div>
    <!-- Lado do Formulário -->
    <div class="md:w-1/2 w-full p-8 flex flex-col justify-center">
      <h2 class="text-2xl font-bold mb-6 text-blue-700 text-center">
        Crie sua conta
      </h2>
      <form
        [formGroup]="registerForm"
        (ngSubmit)="onSubmit()"
        class="flex flex-col gap-4"
      >
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >CNPJ</label
          >
          <input
            type="text"
            formControlName="cnpj"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
            (keyup)="findcnpj()"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Razão social</label
          >
          <input
            type="text"
            formControlName="nome"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >E-mail</label
          >
          <input
            type="email"
            formControlName="email"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Senha</label
          >
          <input
            type="password"
            formControlName="senha"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Confirme sua senha</label
          >
          <input
            type="password"
            formControlName="confirmSenha"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          />
        </div>
        <button
          type="submit"
          [disabled]="registerForm.invalid"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-bold transition"
        >
          Registrar
        </button>
      </form>
      <p class="mt-6 text-center text-sm text-gray-500">
        Já tem uma conta?
        <a
          routerLink="/auth/login"
          class="text-blue-600 font-semibold hover:underline"
        >
          Faça login
        </a>
      </p>
      <div *ngIf="errorMessage" class="text-red-500 text-sm mt-4">
        {{ errorMessage }}
      </div>
    </div>
  </div>
</div>
