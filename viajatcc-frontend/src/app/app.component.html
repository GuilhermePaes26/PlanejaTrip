<ng-container *ngIf="initialLoading; else appTpl">
  <div class="loading-screen" *ngIf="isBrowser">
    <mat-spinner></mat-spinner>
  </div>
</ng-container>

<ng-template #appTpl>
  <router-outlet></router-outlet>

  <div *ngIf="loading" class="loading-overlay">
    <mat-spinner></mat-spinner>
  </div>
</ng-template>
